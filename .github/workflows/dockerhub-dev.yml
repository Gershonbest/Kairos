name: Docker Hub Push (Dev)

on:
  push:
    branches:
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/dockerhub-dev.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: orheo-backend-dev

jobs:
  docker-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare dev tags
        id: tags
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          TAGS="${IMAGE}:dev,${IMAGE}:dev-${SHORT_SHA},${IMAGE}:sha-${SHORT_SHA}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push dev image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
