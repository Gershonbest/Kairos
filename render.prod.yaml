# Render Blueprint (Production): frontend + backend + Redis in one project.
# Database stays on Neon (set DATABASE_URL as a secret in the dashboard).
#
# First deploy:
#   1. Push this repo to GitHub.
#   2. Render Dashboard -> New -> Blueprint -> pick this repo.
#   3. Choose this file: render.prod.yaml
#   4. Fill in the secret env vars marked `sync: false` (DATABASE_URL, JWT_SECRET, etc.).
#
# Redeploys: `git push` (auto-deploy).

services:
  # ----- Managed Redis (Key Value) -----
  - type: keyvalue
    name: orheo-redis-prod
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []   # only reachable from other Render services

  # ----- Backend (FastAPI) -----
  - type: web
    name: orheo-backend-prod
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # healthCheckPath: /health/live
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Neon connection string (postgresql+asyncpg://...?sslmode=require)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      # Redis wired automatically from the managed Key Value instance above.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: orheo-redis-prod
          property: connectionString
      # Production public URLs (recommended: set these in the dashboard).
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: PUBLIC_BOOKING_BASE_URL
        sync: false
      # Media uploads go to S3 (required in production). Set values in the dashboard.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      # Optional integrations — set in dashboard when ready.
      - key: BREVO_API_KEY
        sync: false
      - key: GOOGLE_GMAIL_SENDER
        sync: false
      - key: GOOGLE_GMAIL_APP_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: PAYSTACK_PLATFORM_FEE_PERCENT
        value: "5.0"
      - key: PAYSTACK_CHANNELS
        value: card,bank,ussd,bank_transfer,qr
      - key: PAYSTACK_CALLBACK_URL_PLATFORM
        value: https://www.orheo.com/dashboard
      - key: PAYSTACK_CALLBACK_URL_BOOKING
        value: https://www.orheo.com/book
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: MESSAGING_DRY_RUN
        value: "true"

  # ----- Frontend (Vite build served by nginx) -----
  - type: web
    name: orheo-frontend-prod
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    envVars:
      # Baked into the SPA at build time (see ARG in ./Dockerfile).
      # Points the browser at the backend's public API.
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_PAYSTACK_PUBLIC_KEY
        sync: false
